name: Build

# main への push / PR ではビルドと動作確認だけ行い、
# v1.0.0 のようなタグを push したときは Release を作って exe（zip）を添付する
#
# ビルドと動作確認を別のジョブに分けている。
# ビルド側のランナーには ffmpeg を一切入れないので、
# 動作確認のために入れた ffmpeg が配布物に混ざる棄権を構造的に避けるため。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- build zip.----------
  # ffmpeg の配布用ビルドは GPLv3 なので
  # 同梱すると対応ソースの提供義務が生じる（THIRD-PARTY-NOTICES.md 参照）。そのため、ffmpegは入れない。
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content config.py -Raw) -replace 'VERSION = ".*?"', "VERSION = `"$v`"" | Set-Content config.py -Encoding utf8

      - name: Build exe
        run: >
          pyinstaller app.py --noconfirm --windowed --onedir --name AC6Stamp
          --icon assets/icon.ico
          --collect-all tkinterdnd2
          --exclude-module imageio_ffmpeg
          --collect-submodules winrt
          --hidden-import winrt.windows.media.ocr
          --hidden-import winrt.windows.globalization
          --hidden-import winrt.windows.graphics.imaging
          --hidden-import winrt.windows.storage.streams
          --hidden-import winrt.windows.foundation
          --hidden-import winrt.windows.foundation.collections

      - name: Package
        shell: pwsh
        run: |
          # opencv の wheel が持ち込む FFmpeg DLL（LGPL）は使っていないので取り除く
          Get-ChildItem dist\AC6Stamp -Recurse -File -Include "opencv_videoio_ffmpeg*.dll" | Remove-Item -Force
          Copy-Item obs\ac6stamp_obs.lua dist\AC6Stamp\
          Copy-Item docs\使い方.txt dist\AC6Stamp\
          Copy-Item LICENSE dist\AC6Stamp\
          Copy-Item THIRD-PARTY-NOTICES.md dist\AC6Stamp\
          Compress-Archive -Path dist\AC6Stamp -DestinationPath AC6Stamp-win64.zip

      # 配布する zip そのものを検査する。
      - name: Assert no ffmpeg in the zip
        shell: pwsh
        run: |
          $ban = @("*ffmpeg*", "avcodec*", "avformat*", "avutil*", "avdevice*",
                   "avfilter*", "swscale*", "swresample*", "postproc*")
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path AC6Stamp-win64.zip))
          try {
            $hit = foreach ($e in $zip.Entries) {
              if (-not $e.Name) { continue }   # ディレクトリのエントリは飛ばす
              foreach ($p in $ban) { if ($e.Name -like $p) { $e.FullName; break } }
            }
          } finally { $zip.Dispose() }
          if ($hit) { throw "ffmpeg was bundled into the zip: $($hit -join ', ')" }
          "no ffmpeg in AC6Stamp-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: AC6Stamp-win64
          path: AC6Stamp-win64.zip

  # ---------- 配布する zip を、利用者と同じ状態のランナーで動かす ----------
  test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AC6Stamp-win64

      # ランナーの画像に ffmpeg は入っていないので、利用者と同じように PATH へ入れる。
      # 別ステップにしているのは、PATH が次のステップで読み直されるようにするため。
      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg --no-progress -y

      - name: Self test (OCR and ffmpeg in the packaged exe)
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { throw "ffmpeg is not on PATH on this runner" }
          Expand-Archive -Path AC6Stamp-win64.zip -DestinationPath extracted
          if (-not (Test-Path "extracted\AC6Stamp\AC6Stamp.exe")) { throw "AC6Stamp.exe not found in the zip" }
          $exe = (Resolve-Path "extracted\AC6Stamp\AC6Stamp.exe").Path
          $p = Start-Process $exe -ArgumentList "--selftest", "selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest failed" }
          if (-not (Select-String -Path selftest.txt -Pattern "engine: Windows OCR" -Quiet)) { throw "Windows OCR is not used" }

  # ---------- 動作確認が通ったタグのみ Release にする ----------
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AC6Stamp-win64

      - uses: softprops/action-gh-release@v2
        with:
          files: AC6Stamp-win64.zip
          generate_release_notes: true
