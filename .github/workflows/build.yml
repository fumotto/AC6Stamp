name: Build

# main への push / PR ではビルドと動作確認だけ行い、
# v1.0.0 のようなタグを push したときは Release を作って exe（zip）を添付する
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content config.py -Raw) -replace 'VERSION = ".*?"', "VERSION = `"$v`"" | Set-Content config.py -Encoding utf8

      - name: Build exe
        run: >
          pyinstaller app.py --noconfirm --windowed --onedir --name AC6Stamp
          --icon assets/icon.ico
          --collect-all tkinterdnd2
          --exclude-module imageio_ffmpeg
          --collect-submodules winrt
          --hidden-import winrt.windows.media.ocr
          --hidden-import winrt.windows.globalization
          --hidden-import winrt.windows.graphics.imaging
          --hidden-import winrt.windows.storage.streams
          --hidden-import winrt.windows.foundation
          --hidden-import winrt.windows.foundation.collections

      # ffmpeg は GPLv3 ビルドのため同梱しない（THIRD-PARTY-NOTICES.md 参照）。
      # imageio_ffmpeg は pyinstaller-hooks-contrib のフックが
      # collect_data_files(..., subdir="binaries") で ffmpeg.exe を自動的に取り込むので、
      # --collect-all を外すだけでは不十分。上の --exclude-module で止めている。
      # opencv の wheel が持ち込む FFmpeg DLL も使っていないので、ここで取り除く。
      - name: Strip bundled ffmpeg
        shell: pwsh
        run: |
          Get-ChildItem dist\AC6Stamp -Recurse -Include "opencv_videoio_ffmpeg*.dll" | Remove-Item -Force
          $f = Get-ChildItem dist\AC6Stamp -Recurse -Include "ffmpeg*.exe", "avcodec*.dll", "avformat*.dll"
          if ($f) { throw "ffmpeg was bundled into the build: $($f.FullName -join ', ')" }

      - name: Self test (OCR and ffmpeg inside the built exe)
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { throw "ffmpeg is not on PATH on this runner" }
          $p = Start-Process dist\AC6Stamp\AC6Stamp.exe -ArgumentList "--selftest", "selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest failed" }
          if (-not (Select-String -Path selftest.txt -Pattern "engine: Windows OCR" -Quiet)) { throw "Windows OCR is not used" }

      - name: Package
        shell: pwsh
        run: |
          Copy-Item obs\ac6stamp_obs.lua dist\AC6Stamp\
          Copy-Item docs\使い方.txt dist\AC6Stamp\
          Copy-Item LICENSE dist\AC6Stamp\
          Copy-Item THIRD-PARTY-NOTICES.md dist\AC6Stamp\
          Compress-Archive -Path dist\AC6Stamp -DestinationPath AC6Stamp-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AC6Stamp-win64
          path: AC6Stamp-win64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AC6Stamp-win64.zip
          generate_release_notes: true
